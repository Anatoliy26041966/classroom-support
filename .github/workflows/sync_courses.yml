name: Auto Update Courses via GAM

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  update-courses:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install GAM
        run: |
          mkdir -p ~/.gam
          curl -sB https://raw.githubusercontent.com/taers232c/GAMADV-XTD3/master/src/gam-install.sh | bash -s -- -n -d "$HOME/bin" || true
          echo "$HOME/bin/gamadv-xtd3" >> $GITHUB_PATH
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Restore GAM Credentials
        run: |
          if [ -n "${{ secrets.GAM_SERVICE_ACCOUNT }}" ]; then
            echo "${{ secrets.GAM_SERVICE_ACCOUNT }}" | base64 -d > ~/.gam/oauth2service.json 2>/dev/null || true
            echo "client_id = ''" > ~/.gam/gam.cfg
          fi

      - name: Fetch Courses from Google Workspace via GAM
        run: |
          export PATH="$HOME/bin/gamadv-xtd3:$HOME/bin:$PATH"
          if command -v gam &> /dev/null; then
            gam print courses state ACTIVE fields id,name,ownerId > courses_gam.csv 2>/dev/null || echo "id,name,ownerId" > courses_gam.csv
          else
            echo "id,name,ownerId" > courses_gam.csv
          fi

      - name: Convert GAM CSV to courses.json
        run: python convert_courses.py

      - name: Commit and Push changes to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add courses.json

          if git diff --staged --quiet; then
            echo "No changes in courses."
          else
            git commit -m "auto: daily update courses.json via GAM [skip ci]"
            git push origin main
          fi
